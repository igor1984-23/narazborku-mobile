name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Раньше здесь стоял reactivecircus/android-emulator-runner@v2 — он нужен
      # для ЭМУЛЯТОРА, а для сборки APK не требуется, и на GitHub-hosted runner
      # он падал на «Setup Android SDK» (с 2026-09-21, все прогоны красные).
      # Для assembleRelease достаточно SDK + build-tools + platform.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm install --no-audit --no-fund @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6

      # Приложение работает через server.url (живой https://narazborku.ru) —
      # веб-бандл в APK нужен только как fallback при ошибке загрузки.
      # Кладём минимальный loader, который редиректит на живой сайт.
      - name: Prepare web assets (fallback loader)
        run: |
          rm -rf www && mkdir -p www
          cp -r out/. www/ 2>/dev/null || echo "no out/ directory — using loader only"

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build APK (release, unsigned)
        run: |
          cd android
          chmod +x gradlew
          # release-сборка требует подписи; в CI ключа нет, поэтому собираем debug.
          # Подписанный release-APK собирается локально (см. README).
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -40

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: narazborku-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30
